name = "my-price-bazar"
main = "src/index.js"
compatibility_date = "2026-10-07"

# تنظیم کرون‌جاب برای ساعت ۱۵:۳۰ UTC (معادل ۱۹:۰۰ تهران)
# اگر ساعت دیگری هم می‌خواهید، می‌توانید خطوط جدید اضافه کنید.
triggers = { cron = ["30 15 * * *"] }

# تعریف متغیرهای محیطی (مقادیر واقعی را در داشبورد کلادفلر یا با wrangler secret put تنظیم کنید)
